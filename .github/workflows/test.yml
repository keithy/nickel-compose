name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise trust && mise install

      - name: Run test suite
        # Runs typecheck, merge, and dummy-project specs. The
        # podclaws spec self-skips when /code/podclaws/ isn't
        # available (CI), so it never fails here.
        run: mise run test